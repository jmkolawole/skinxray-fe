name: Deploy to Production

on:
  push:
    branches: [ main ]  # Change to your main branch name if different ok

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        env:
          VITE_APP_API_URL: 'https://api.skinxray.com'
          
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to server
        run: |
          # Create a temporary tar of the dist directory
          tar -czf dist.tar.gz dist/
          
          # Copy the tar file to the server
          scp -P ${{ secrets.SSH_PORT }} dist.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/skinxray.com/frontend/
          
          # Extract and replace the old build on the server
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /var/www/skinxray.com/frontend/ && \
            rm -rf dist-old/ && \
            [ -d dist ] && mv dist dist-old || true && \
            tar -xzf dist.tar.gz && \
            rm dist.tar.gz"